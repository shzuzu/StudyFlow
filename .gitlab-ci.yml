image: golang:1.24-alpine

stages:
  - test
  - build

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  COMPOSE_VERSION: "v2.23.0"
  CGO_ENABLED: "1"
  GOOS: "linux"
  MIN_COVERAGE: 30

before_script:
  - apk add --no-cache docker-cli docker-cli-compose build-base
  - docker --version
  - docker compose version

test_payment_service:
  stage: test
  script:
    - cd payment_service/internal/service
    - |
      echo "Running tests with coverage check..."
      go test -cover ./... | awk '
        /coverage:/ {
          cov = $2
          gsub(/%/, "", cov)
          printf "Test coverage: %.1f%%\n", cov
          if (cov < ENVIRON["MIN_COVERAGE"]) {
            print "❌ Below minimum coverage of " ENVIRON["MIN_COVERAGE"] "%"
            exit 1
          }
          else {
            print "✅ Coverage check passed"
          }
        }
      '
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test_schedule_service:
  stage: test
  script:
    - cd schedule_service/internal/service/service
    - |
      echo "Running tests with coverage check..."
      go test -cover ./... | awk '
        /coverage:/ {
          cov = $2
          gsub(/%/, "", cov)
          printf "Test coverage: %.1f%%\n", cov
          if (cov < ENVIRON["MIN_COVERAGE"]) {
            print "❌ Below minimum coverage of " ENVIRON["MIN_COVERAGE"] "%"
            exit 1
          }
          else {
            print "✅ Coverage check passed"
          }
        }
      '
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build_services:
  stage: build
  needs: ["test_payment_service", "test_schedule_service"]
  parallel: 3
  script:
    - docker compose build --parallel
  artifacts:
    paths:
      - ./*/Dockerfile
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
