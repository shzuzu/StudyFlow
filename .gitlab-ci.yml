image: golang:1.24-alpine

stages:
  - test
  - build

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

before_script:
  - apk add --no-cache docker-cli docker-cli-compose
  - docker --version
  - docker compose version

test_payment_service:
  stage: test
  script:
    - cd payment_service/internal/service
    - go test -race -cover

build_services:
  stage: build
  needs: ["test_payment_service"]
  script:
    - docker-compose build
  artifacts:
    paths:
      - ./*/Dockerfile
    expire_in: 1 week
