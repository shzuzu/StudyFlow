image: golang:1.24-alpine

services:
  - name: docker:dind
    command: ["--tls=false"]

stages:
  - test
  - build

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_VERIFY: "0"
  DOCKER_TLS_CERTDIR: ""
  COMPOSE_VERSION: "v2.23.0"
  CGO_ENABLED: "1"
  GOOS: "linux"
  TELEGRAM_SECRET: "anxious-secret-value"

before_script:
  - apk add --no-cache docker-cli docker-cli-compose build-base
  - docker info
  - docker compose version
  - |
    echo "Waiting for Docker to start..."
    for i in $(seq 1 30); do
      if docker info > /dev/null 2>&1; then
        echo "Docker is up and running!"
        break
      fi
      echo "Waiting for Docker to start... ($i/30)"
      sleep 1
    done

test_payment_service:
  stage: test
  script:
    - cd payment_service/internal/service
    - |
      echo "[INFO]: 🚀Running tests with coverage check..."
      coverage=$(go test -cover ./... | grep -E 'coverage:.*%' | awk '{gsub(/%/,"",$5); print $5}')
      echo "[INFO]: 📒Actual test coverage: ${coverage}%"

      if [ $(echo "$coverage < 30" | bc -l) -eq 1 ]; then
        echo "[ERROR]: Coverage ${coverage}% is below 30% threshold"
        exit 1
      else
        echo "[PASS]: ✅ Coverage check passed"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test_schedule_service:
  stage: test
  script:
    - cd schedule_service/internal/service/service
    - |
      echo "[INFO]: 🚀Running tests with coverage check..."
      coverage=$(go test -cover ./... | grep -E 'coverage:.*%' | awk '{gsub(/%/,"",$5); print $5}')
      echo "[INFO]: 📒Actual test coverage: ${coverage}%"

      if [ $(echo "$coverage < 30" | bc -l) -eq 1 ]; then
        echo "[ERROR]: Coverage ${coverage}% is below 30% threshold"
        exit 1
      else
        echo "[PASS]: ✅ Coverage check passed"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build_services:
  stage: build
  needs: ["test_payment_service", "test_schedule_service"]
  script:
    - docker compose build --parallel
  artifacts:
    paths:
      - ./*/Dockerfile
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
