image: golang:1.24-alpine

stages:
  - test
  - build

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  COMPOSE_VERSION: "v2.23.0"
  CGO_ENABLED: "1"
  GOOS: "linux"

before_script:
  - apk add --no-cache docker-cli docker-cli-compose build-base
  - docker --version
  - docker compose version

test_payment_service:
  stage: test
  script:
    - cd payment_service/internal/service
    - |
      coverage=$(go test -cover ./... | grep -E 'coverage:.*%' | awk '{gsub(/%/,"",$5); print $5}')
      echo "Actual test coverage: ${coverage}%"

      if [ $(echo "$coverage < 30" | bc -l) -eq 1 ]; then
        echo "ERROR: Coverage ${coverage}% is below 30% threshold"
      else
        echo "✅ Coverage check passed"
      fi

  artifacts:
    paths:
      - payment_service/internal/service/coverage.out

build_services:
  stage: build
  needs: ["test_payment_service"]
  script:
    - docker compose build
  artifacts:
    paths:
      - ./*/Dockerfile
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
